<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" role="img" aria-labelledby="title desc">
<title id="title">CuraOS — Hospital Operating System</title>
<desc id="desc">C-shaped gradient mark with stethoscope icon and CuraOS wordmark</desc>
<defs>
  <linearGradient id="c-grad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#00D1FF"/>
    <stop offset="35%" stop-color="#0A7CFF"/>
    <stop offset="70%" stop-color="#5B4DFF"/>
    <stop offset="100%" stop-color="#B94DFF"/>
  </linearGradient>
  <linearGradient id="c-light" x1="10%" y1="0%" x2="90%" y2="80%">
    <stop offset="0%" stop-color="#7CE8FF" stop-opacity="0.95"/>
    <stop offset="100%" stop-color="#0A7CFF" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="os-grad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#0AB6FF"/>
    <stop offset="55%" stop-color="#2E6BFF"/>
    <stop offset="100%" stop-color="#8B2DFF"/>
  </linearGradient>
  <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#0AB6FF"/>
    <stop offset="50%" stop-color="#0957FF"/>
    <stop offset="100%" stop-color="#00D1CC"/>
  </linearGradient>
  <radialGradient id="inner-blue" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#3AA0FF"/>
    <stop offset="100%" stop-color="#0B5CFF"/>
  </radialGradient>
</defs>
<!-- Left C mark -->
<g>
  <!-- Main C shape with organic blobs -->
  <path d="M 110 12 C 48 22 18 62 32 118 C 42 155 82 185 126 192 C 158 196 188 180 196 158 C 202 140 188 128 162 121 C 148 117 132 118 122 105 C 96 75 118 44 152 38 C 172 34 190 43 198 28 C 207 12 178 3 148 6 C 136 7 122 10 110 12 Z" fill="url(#c-grad)"/>
  <!-- highlight sweep -->
  <path d="M 48 48 C 70 58 118 24 188 28 C 190 22 182 12 168 8 C 118 4 64 22 48 48 Z" fill="url(#c-light)" opacity="0.85"/>
  <path d="M 38 115 C 62 98 82 78 82 50 C 58 62 42 88 38 115 Z" fill="#fff" opacity="0.18"/>
  <!-- white ring -->
  <circle cx="108" cy="106" r="54" fill="white" stroke="white" stroke-width="3"/>
  <!-- inner blue circle -->
  <circle cx="108" cy="106" r="42" fill="url(#inner-blue)"/>
  <!-- stethoscope icon white -->
  <g stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 92 82 C 86 86 82 96 88 104 C 94 112 96 124 96 132 C 96 138 100 142 108 143 C 116 144 122 140 122 134 C 122 128 118 122 112 122 C 107 122 104 126 104 130"/>
    <path d="M 88 86 C 88 78 92 72 100 72 C 108 72 112 76 112 84"/>
    <circle cx="100" cy="72" r="4.5" fill="white" stroke="white"/>
    <circle cx="118" cy="122" r="10" fill="none" stroke="white" stroke-width="4.5"/>
    <circle cx="118" cy="122" r="3" fill="white" stroke="none"/>
  </g>
</g>
<!-- Wordmark -->
<g font-family="Inter, system-ui, sans-serif" font-weight="900">
  <text x="235" y="132" font-size="118" letter-spacing="-3" fill="#0F172A">ura</text>
  <text x="430" y="132" font-size="118" letter-spacing="-4" fill="url(#os-grad)">OS</text>
</g>
<!-- ECG line -->
<g>
  <path d="M 238 158 H 398 L 412 128 L 426 188 L 440 128 L 452 152 L 462 132 L 472 158 H 720" fill="none" stroke="url(#line-grad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="730" cy="158" r="10" fill="white" stroke="#00C8C5" stroke-width="5"/>
</g>
<!-- Subtitle -->
<g font-family="Inter, system-ui, sans-serif" font-weight="600" letter-spacing="5.2">
  <text x="238" y="192" font-size="16.5" fill="#34445E">HOSPITAL OPERATING SYSTEM</text>
</g>
</svg>
